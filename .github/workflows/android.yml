name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: false
      # Termux:X11 and its X server sources (xserver, pixman, ...) build from source.
      - name: Fetch submodules
        run: git submodule update --init --recursive --jobs 8 --depth 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # The runner image ships the Android SDK; add the pinned NDK and platform.
      - name: Install the pinned NDK
        run: >
          yes | "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager" --install
          "ndk;$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          "platforms;android-36"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '.gitmodules') }}
          restore-keys: ${{ runner.os }}-gradle-
      - name: Build debug APK
        run: >
          ./gradlew --no-daemon assembleDebug
          -PdeskdroidRootfsBaseUrl=https://github.com/${{ github.repository }}/releases/download/rootfs-latest/
          -PdeskdroidImagePublicKey="${{ vars.MINISIGN_PUBLIC_KEY }}"
      - uses: actions/upload-artifact@v4
        with:
          name: deskdroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
