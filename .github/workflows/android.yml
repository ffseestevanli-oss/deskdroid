name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install the pinned NDK
        run: sdkmanager --install "ndk;$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/build.gradle.kts)"
      - name: Build debug APK
        run: >
          ./gradlew --no-daemon assembleDebug
          -PdeskdroidRootfsBaseUrl=https://github.com/${{ github.repository }}/releases/download/rootfs-latest/
      - uses: actions/upload-artifact@v4
        with:
          name: deskdroid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
