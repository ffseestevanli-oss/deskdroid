name: Publish alpha release
on:
  push:
    branches: [claude/project-thread-e6lcif]
    paths: ['.github/workflows/publish-alpha.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          gh run download 41349318737 -n deskdroid-debug-apk -D apk
          ls -la apk
          src=$(find apk -name '*.apk' | head -1)
          cp "$src" deskdroid-0.1.0-alpha-build-200.apk
          sha256sum deskdroid-0.1.0-alpha-build-200.apk
          gh release create v0.1.0-alpha deskdroid-0.1.0-alpha-build-200.apk \
            --target 3731845f51465092b6ce679b42b10beeb7aea591 \
            --title "DeskDroid 0.1.0 alpha (build 200): native Plasma" \
            --notes-file .github/release/notes.md --prerelease --latest=false
