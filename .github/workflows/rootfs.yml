name: Rootfs image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['rootfs/**']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install mmdebstrap
        run: sudo apt-get update && sudo apt-get install -y mmdebstrap xz-utils debian-archive-keyring
      - name: Build rootfs
        run: sudo rootfs/build-rootfs.sh "$PWD/out"
      - name: Publish as the rootfs-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete rootfs-latest --yes --cleanup-tag || true
          gh release create rootfs-latest out/deskdroid-rootfs-arm64.tar.xz out/deskdroid-rootfs-arm64.tar.xz.sha256 \
            --title "Rootfs (latest)" --notes "Debian trixie arm64 + KDE Plasma, built from ${{ github.sha }}" --prerelease
