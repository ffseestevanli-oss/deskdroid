name: Floorp

# The web browser: Floorp's runtime (Firefox) ported to the native desktop,
# desktop Firefox on GTK 3/Wayland for Android's libc (native/floorp). Built
# against the GTK stack from the Plasma deps cache; a compiler cache keeps
# later runs short.
on:
  pull_request:
    paths:
      - native/floorp/**
      - .github/workflows/floorp.yml
  workflow_dispatch:

jobs:
  # A pull request's paths filter looks at the whole PR, so every push starts
  # this workflow: build only when the push itself changes Floorp's files (or
  # it's the PR's first run), and never cancel a build for an unrelated push.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      floorp: ${{ steps.diff.outputs.floorp }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
          ACTION: ${{ github.event.action }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || [ "$ACTION" != synchronize ] || [ -z "$BEFORE" ] \
             || ! git cat-file -e "$BEFORE" 2>/dev/null \
             || git diff --name-only "$BEFORE" HEAD | grep -qE '^(native/floorp/|\.github/workflows/floorp\.yml$)'; then
            echo floorp=true >> "$GITHUB_OUTPUT"
          else
            echo floorp=false >> "$GITHUB_OUTPUT"
          fi
  floorp:
    needs: changes
    if: needs.changes.outputs.floorp == 'true'
    concurrency:
      group: floorp-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Make room (Firefox needs ~25 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          # Swap: Gecko's Rust and its big C++ units run the runner out of memory
          # (it was shut down 20 minutes into the build).
          sudo swapoff -a || true
          sudo fallocate -l 24G /swapfile2 && sudo chmod 600 /swapfile2 && sudo mkswap /swapfile2 && sudo swapon /swapfile2
          free -h
          df -h /
      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-19 libclang-19-dev lld-19 llvm-19 pkg-config unzip zip m4 nasm
          rustup target add aarch64-linux-android
          cargo install cbindgen --locked
          curl -sSfL https://github.com/mozilla/sccache/releases/download/v0.10.0/sccache-v0.10.0-x86_64-unknown-linux-musl.tar.gz | tar xz
          sudo install sccache-*/sccache /usr/local/bin/
          echo "SCCACHE_DIR=$HOME/.cache/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_CACHE_SIZE=8G" >> "$GITHUB_ENV"
      - name: Install the pinned NDK
        run: >
          yes | "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager" --install
          "ndk;$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          && echo "NDK=$ANDROID_HOME/ndk/$(sed -n 's/.*ndkVersion = "\(.*\)".*/\1/p' app/build.gradle.kts)" >> "$GITHUB_ENV"
      - name: GTK and friends (Plasma deps cache)
        uses: actions/cache/restore@v4
        with:
          # The same paths as plasma.yml saves: they're part of the cache's identity.
          path: |
            ~/plasma-prefix
            ~/.cache/deskdroid/plasma
          key: plasma-deps-none
          restore-keys: plasma-deps-
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/sccache
          key: floorp-sccache-${{ github.run_id }}
          restore-keys: floorp-sccache-
      - name: Fetch Floorp's runtime source
        run: |
          mkdir ~/floorp-src && cd ~/floorp-src
          git init -q && git remote add origin https://github.com/Floorp-Projects/Floorp-Runtime
          git fetch -q --depth 1 origin "$(cat "$GITHUB_WORKSPACE/native/floorp/runtime-commit.txt")"
          git checkout -q FETCH_HEAD
          du -sh . && df -h /
      - name: Build
        run: native/floorp/build.sh ~/plasma-prefix "$NDK" ~/floorp-src ~/floorp-out
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.cache/sccache
          key: floorp-sccache-${{ github.run_id }}
      # The APK build (android.yml) takes the newest package from here.
      - name: Publish as the floorp-build release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pkg="$(ls ~/floorp-out/*.tar.* | head -1)"
          notes="Floorp for DeskDroid, built from $(cat native/floorp/runtime-commit.txt) by run ${{ github.run_id }} (${{ github.event.pull_request.head.sha || github.sha }}). The APK bundles it."
          if gh release view floorp-build >/dev/null 2>&1; then
            gh release edit floorp-build --notes "$notes" --prerelease --latest=false
          else
            gh release create floorp-build --title "Floorp build for DeskDroid" --notes "$notes" --prerelease --latest=false
          fi
          gh release view floorp-build --json assets -q '.assets[].name' | while read -r old; do gh release delete-asset floorp-build "$old" --yes; done
          cp "$pkg" ~/floorp.tar.xz && gh release upload floorp-build ~/floorp.tar.xz --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: floorp
          path: ~/floorp-out
          retention-days: 7
