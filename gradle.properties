org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Termux:X11's lorie module uses AndroidX.
android.useAndroidX=true
kotlin.code.style=official
# Where rootfs images are downloaded from: the app reads deskdroid-images.json
# there. CI overrides it with the real repo.
deskdroidRootfsBaseUrl=https://github.com/OWNER/deskdroid/releases/download/rootfs-latest/
# minisign public key (the base64 line of the .pub file) that system images
# must be signed with. Empty: debug builds check SHA-256 only, release builds refuse.
deskdroidImagePublicKey=
